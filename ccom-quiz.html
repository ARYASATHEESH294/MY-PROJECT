<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCOM Practice Quiz – Part B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#14213d;--mute:#5b6784;--line:#d9e0ee;--ok:#1b8a4b;--bad:#c62f3b;
--a:#2b579a;--b:#217346;--c:#c43e1c;--d:#8e2f4a;--sec:var(--a)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1626;--card:#18223a;--ink:#eef2fb;--mute:#9aa7c4;--line:#2a3757;--ok:#4cc783;--bad:#ff7a85;
--a:#7aa2f0;--b:#5cc58b;--c:#ff8a65;--d:#e57a99}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,Segoe UI,sans-serif;
padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.hero{background:linear-gradient(135deg,#14213d 0%,#2b579a 100%);color:#fff;padding:56px 20px 70px}
.wrap{max-width:820px;margin:0 auto}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.02;font-weight:800}
.hero p{max-width:52ch;opacity:.88;margin:14px 0 24px;font-size:1.05rem}
.apps{display:flex;gap:10px;flex-wrap:wrap}
.apps span{padding:6px 14px;border-radius:999px;font-weight:700;font-size:.9rem;color:#fff}
.apps .w{background:#2b579a;outline:2px solid #ffffff55}.apps .x{background:#217346}.apps .p{background:#c43e1c}.apps .ac{background:#a4373a}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px calc(10px)}
.bar .wrap{display:flex;align-items:center;gap:14px}
.track{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);transition:width .4s}
.score{font-weight:700;white-space:nowrap}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 4px}
nav a{color:var(--ink);text-decoration:none;font-weight:700;font-size:.9rem;border:2px solid var(--line);padding:6px 12px;border-radius:10px}
nav a:hover,nav a:focus-visible{border-color:var(--ink)}
section{background:var(--card);border-radius:18px;margin:26px 0;border:1px solid var(--line);border-top:8px solid var(--sec);overflow:hidden}
section header{padding:22px 24px 8px}
section h2{font-size:1.6rem;color:var(--sec)}
section header p{margin:2px 0 0;color:var(--mute);font-size:.95rem}
.q{padding:16px 24px;border-top:1px solid var(--line)}
.q .t{display:flex;gap:12px}
.n{flex:none;width:32px;height:32px;border-radius:9px;background:var(--sec);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.q.ok .n{background:var(--ok)}.q.bad .n{background:var(--bad)}
.q p{margin:3px 0 10px}
input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;max-width:340px}
input:focus,select:focus,button:focus-visible,.opt:focus-within{outline:3px solid var(--sec);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-left:44px}
.opt{position:relative;display:block;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:500;background:var(--bg)}
.opt input{position:absolute;opacity:0}
.opt:has(input:checked){border-color:var(--sec);background:color-mix(in srgb,var(--sec) 14%,var(--card))}
.ans{margin:0 0 0 44px}
.fb{margin:10px 0 0 44px;font-size:.92rem;font-weight:700;min-height:0}
.fb.g{color:var(--ok)}.fb.r{color:var(--bad)}
.q.ok .opt:has(input:checked){border-color:var(--ok)}.q.bad .opt:has(input:checked){border-color:var(--bad)}
.actions{padding:18px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;background:var(--sec);color:#fff}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:active{transform:translateY(1px)}
#result{display:none;text-align:center;padding:34px 20px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:26px 0}
#result b{font-family:"Bricolage Grotesque",sans-serif;font-size:3.4rem;display:block;line-height:1}
footer{text-align:center;color:var(--mute);padding:10px 20px 50px;font-size:.9rem}
@media(max-width:560px){.q,section header,.actions{padding-left:16px;padding-right:16px}.opts,.ans,.fb{margin-left:0}.opts{margin-top:4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
<h1>CCOM Model Questions<br>Part B</h1>
<p>35 questions on computer basics, Word, Excel, PowerPoint and Access. Answer, check, and see your score.</p>
<div class="apps"><span class="w">Word</span><span class="x">Excel</span><span class="p">PowerPoint</span><span class="ac">Access</span></div>
</div></div>
<div class="bar"><div class="wrap"><div class="track"><div class="fill" id="fill"></div></div><div class="score" id="score">0 / 35 correct</div></div></div>
<main class="wrap">
<nav aria-label="Sections"><a href="#A">A · Fill in the blanks</a><a href="#B">B · Match</a><a href="#C">C · True or false</a><a href="#D">D · Multiple choice</a></nav>
<div id="app"></div>
<div id="result"><b id="pct"></b><p id="msg"></p><button onclick="resetAll()">Try again</button></div>
</main>
<footer>CCOM Model Questions – Part B</footer>
<script>
const S=[
{id:'A',name:'Section A – Fill in the blanks',sub:'10 × 1 = 10 marks · type your answer',col:'--a',type:'fill',start:1,items:[
['The brain of the computer is called __________.',['cpu','centralprocessingunit']],
['__________ is a temporary memory of the computer.',['ram','randomaccessmemory']],
['The shortcut key used to copy selected text is __________.',['ctrl+c','ctrlc','control+c']],
['In MS Word, the shortcut key for saving a document is __________.',['ctrl+s','ctrls','control+s']],
['In MS Excel, a formula begins with the symbol __________.',['=','equalsign','equal','equals']],
['The intersection of a row and a column in Excel is called a __________.',['cell']],
['The default file extension of a PowerPoint presentation is __________.',['.pptx','pptx']],
['The effect used to move from one slide to another is called a __________.',['transition','slidetransition']],
['In MS Access, data is stored in __________.',['table','tables']],
['A field that uniquely identifies each record in a table is called a __________.',['primarykey','primary key']]]},
{id:'B',name:'Section B – Match the following',sub:'5 × 1 = 5 marks · pick the matching item',col:'--b',type:'match',start:11,
opts:{A:'Spreadsheet',B:'Input device',C:'Database',D:'Word processing',E:'Presentation'},items:[
['Keyboard','B'],['MS Word','D'],['MS Excel','A'],['MS PowerPoint','E'],['MS Access','C']]},
{id:'C',name:'Section C – True or false',sub:'10 × 1 = 10 marks',col:'--c',type:'tf',start:16,items:[
['A monitor is an output device.',1],['RAM is a permanent storage device.',0],['MS Word is used to create and edit documents.',1],
['The shortcut key Ctrl + V is used to copy text.',0],['Excel formulas can perform mathematical calculations.',1],
['In Excel, columns are identified by numbers.',0],['MS PowerPoint is used to create presentations.',1],
['Animation effects can be applied to objects in PowerPoint.',1],['MS Access is a database management application.',1],
['A table in MS Access contains records and fields.',1]]},
{id:'D',name:'Section D – Multiple choice',sub:'10 × 1 = 10 marks',col:'--d',type:'mcq',start:26,items:[
['Which of the following is an operating system?',['MS Word','Windows','MS Excel','MS Access'],1],
['Which device is used to print documents?',['Scanner','Keyboard','Printer','Mouse'],2],
['Which shortcut key is used to select all text?',['Ctrl + A','Ctrl + C','Ctrl + X','Ctrl + P'],0],
['Which alignment makes text even along the left and right margins?',['Left','Right','Center','Justify'],3],
['Which Excel function calculates the total of numbers?',['COUNT()','SUM()','MAX()','MIN()'],1],
['Which Excel function calculates the average?',['SUM()','MAX()','AVERAGE()','COUNT()'],2],
['Which PowerPoint view displays slides in a grid for easy rearrangement?',['Normal View','Slide Sorter View','Reading View','Notes View'],1],
['Which PowerPoint feature controls the visual movement of text or objects?',['Animation','Formula','Filter','Mail Merge'],0],
['A row in an MS Access table is called a __________.',['Field','Record','Query','Form'],1],
['Which Access object is used to retrieve specific data from a database?',['Table','Report','Query','Macro'],2]]}
];
const norm=s=>s.toLowerCase().replace(/[\s_]/g,'');
const app=document.getElementById('app');
let results={};
function build(){
 app.innerHTML='';results={};
 S.forEach(sec=>{
  const el=document.createElement('section');el.id=sec.id;el.style.setProperty('--sec','var('+sec.col+')');
  let h=`<header><h2>${sec.name}</h2><p>${sec.sub}</p></header>`;
  sec.items.forEach((it,i)=>{
   const n=sec.start+i,k=sec.id+i;let body='';
   if(sec.type==='fill')body=`<div class="ans"><input type="text" id="${k}" autocomplete="off" aria-label="Answer ${n}"></div>`;
   if(sec.type==='match')body=`<div class="ans"><select id="${k}" aria-label="Match ${n}"><option value="">Choose a match…</option>${Object.entries(sec.opts).map(([l,t])=>`<option value="${l}">${l}. ${t}</option>`).join('')}</select></div>`;
   if(sec.type==='tf')body=`<div class="opts">${['True','False'].map((t,j)=>`<label class="opt"><input type="radio" name="${k}" value="${1-j}">${t}</label>`).join('')}</div>`;
   if(sec.type==='mcq')body=`<div class="opts">${it[1].map((t,j)=>`<label class="opt"><input type="radio" name="${k}" value="${j}">${'ABCD'[j]}) ${t}</label>`).join('')}</div>`;
   const txt=sec.type==='match'?`Match: <b>${it[0]}</b>`:it[0];
   h+=`<div class="q" id="q${k}"><div class="t"><span class="n">${n}</span><p>${txt}</p></div>${body}<div class="fb" id="f${k}"></div></div>`;
  });
  h+=`<div class="actions"><button onclick="check('${sec.id}')">Check section ${sec.id}</button><button class="alt" onclick="reveal('${sec.id}')">Show answers</button></div>`;
  el.innerHTML=h;app.appendChild(el);
 });
}
function val(sec,i){
 const k=sec.id+i;
 if(sec.type==='fill'||sec.type==='match')return document.getElementById(k).value.trim();
 const r=document.querySelector(`input[name="${k}"]:checked`);return r?r.value:'';
}
function label(sec,it){
 if(sec.type==='fill')return it[1][0]==='=' ?'=':({ 'ctrl+c':'Ctrl + C','ctrl+s':'Ctrl + S'}[it[1][0]]||it[1][0].replace(/^./,c=>c.toUpperCase()));
 if(sec.type==='match')return it[1]+'. '+sec.opts[it[1]];
 if(sec.type==='tf')return it[1]?'True':'False';
 return 'ABCD'[it[2]]+') '+it[1][it[2]];
}
function ok(sec,it,v){
 if(v==='')return false;
 if(sec.type==='fill')return it[1].map(norm).includes(norm(v));
 if(sec.type==='match')return v===it[1];
 if(sec.type==='tf')return +v===it[1];
 return +v===it[2];
}
function check(id,force){
 const sec=S.find(s=>s.id===id);let c=0;
 sec.items.forEach((it,i)=>{
  const k=id+i,v=val(sec,i),good=ok(sec,it,v),q=document.getElementById('q'+k),f=document.getElementById('f'+k);
  q.classList.remove('ok','bad');
  if(v===''){f.className='fb r';f.textContent='Not answered. Correct answer: '+label(sec,it);results[k]=0;return}
  q.classList.add(good?'ok':'bad');results[k]=good?1:0;
  f.className='fb '+(good?'g':'r');f.textContent=good?'Correct':'Not quite. Correct answer: '+label(sec,it);
 });
 update();
}
function reveal(id){
 const sec=S.find(s=>s.id===id);
 sec.items.forEach((it,i)=>{const f=document.getElementById('f'+id+i);f.className='fb g';f.textContent='Answer: '+label(sec,it)});
}
function update(){
 const t=Object.values(results).reduce((a,b)=>a+b,0);
 document.getElementById('score').textContent=t+' / 35 correct';
 document.getElementById('fill').style.width=(t/35*100)+'%';
 const done=Object.keys(results).length===35,r=document.getElementById('result');
 if(done){r.style.display='block';document.getElementById('pct').textContent=Math.round(t/35*100)+'%';
  document.getElementById('msg').textContent=t>=30?'Excellent work. You are exam ready.':t>=21?'Good job. Review the questions you missed.':'Keep practising. Check the answers and try again.';}
}
function resetAll(){build();update();document.getElementById('result').style.display='none';window.scrollTo({top:0,behavior:'smooth'})}
build();
</script>
</body>
</html>
